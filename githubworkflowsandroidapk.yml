name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        working-directory: app
        run: flutter create . --platforms=android --org com.belgeasistani
      - name: Install packages
        working-directory: app
        run: flutter pub get
      - name: Build release APK
        working-directory: app
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo 'BACKEND_BASE_URL GitHub repository variable is not set.'
            exit 1
          fi
          flutter build apk --release --dart-define=API_BASE_URL="$BACKEND_BASE_URL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: belge-asistani-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      backend_base_url:
        description: 'Gerçek backend HTTPS adresi'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.belgeasistani

      - name: Ensure Android Internet permission
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Android manifest not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              pos = s.find('>')
              if pos == -1:
                  raise SystemExit("Invalid AndroidManifest.xml")
              s = s[:pos+1] + "\n    " + permission + s[pos+1:]
              p.write_text(s, encoding="utf-8")

          print("Internet permission verified.")
          PY

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Flutter packages
        run: flutter pub get

      - name: Set Android modules to compileSdk 36
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("android"),
              Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          ]

          gradle_files = []

          for root in roots:
              if root.exists():
                  gradle_files.extend(root.rglob("build.gradle"))
                  gradle_files.extend(root.rglob("build.gradle.kts"))

          patterns = [
              (r'(?m)^(\s*compileSdkVersion\s+)(?:flutter\.compileSdkVersion|\d+)(\s*(?://.*)?)$', r'\g<1>36\g<2>'),
              (r'(?m)^(\s*compileSdk\s*=\s*)(?:flutter\.compileSdkVersion|\d+)(\s*(?://.*)?)$', r'\g<1>36\g<2>'),
              (r'(?m)^(\s*compileSdk\s+)(?:flutter\.compileSdkVersion|\d+)(\s*(?://.*)?)$', r'\g<1>36\g<2>'),
          ]

          for file in gradle_files:
              try:
                  original = file.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue

              updated = original

              for pattern, replacement in patterns:
                  updated = re.sub(pattern, replacement, updated)

              if updated != original:
                  file.write_text(updated, encoding="utf-8")

          app_groovy = Path("android/app/build.gradle")
          app_kotlin = Path("android/app/build.gradle.kts")

          app_file = app_groovy if app_groovy.exists() else app_kotlin

          if not app_file.exists():
              raise SystemExit("Android app Gradle file not found.")

          app_text = app_file.read_text(encoding="utf-8")

          if not re.search(r'(?m)^\s*compileSdk(?:Version)?(?:\s*=\s*|\s+)36\b', app_text):
              raise SystemExit("compileSdk 36 was not applied.")

          print("compileSdk 36 verified.")
          PY

      - name: Configure backend URL
        id: backend
        env:
          INPUT_BACKEND_BASE_URL: ${{ inputs.backend_base_url }}
          VARIABLE_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          SECRET_BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
        shell: bash
        run: |
          URL="${INPUT_BACKEND_BASE_URL:-${VARIABLE_BACKEND_BASE_URL:-${SECRET_BACKEND_BASE_URL:-}}}"

          if [ -z "$URL" ]; then
            echo "ERROR: BACKEND_BASE_URL is missing."
            echo "Add it under GitHub Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          if [[ "$URL" != https://* ]]; then
            echo "ERROR: Backend must use HTTPS."
            exit 1
          fi

          URL="${URL%/}"

          if [[ "$URL" == *".example"* || "$URL" == *"BACKEND-DOMAINININIZ"* ]]; then
            echo "ERROR: Placeholder backend address is not allowed."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL configured."

      - name: Check backend health
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        shell: bash
        run: |
          HEALTH_URL="${BACKEND_URL}/health"

          echo "Checking backend health..."

          HTTP_CODE=$(curl -L -s -o /tmp/backend-health.json \
            -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            "$HEALTH_URL" || true)

          echo "Health HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Backend health check failed."
            cat /tmp/backend-health.json || true
            exit 1
          fi

          cat /tmp/backend-health.json
          echo "Backend health check passed."

      - name: Verify Flutter source
        shell: bash
        run: |
          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found."
            exit 1
          }

          if grep -q "import 'config.dart';" lib/main.dart; then
            echo "ERROR: main.dart still imports config.dart."
            exit 1
          fi

          grep -q "class AppConfig" lib/main.dart || {
            echo "ERROR: AppConfig not found in main.dart."
            exit 1
          }

          echo "Flutter source verified."

      - name: Build release APK
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          flutter build apk --release --no-pub \
            --dart-define=API_BASE_URL="$BACKEND_URL"

      - name: Verify APK
        id: find_apk
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK was not created."
            find build android -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: belge-asistani-android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

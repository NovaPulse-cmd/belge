name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.belgeasistani

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          BACKEND_BASE_URL="${BACKEND_BASE_URL:-https://example.com}"
          echo "Using BACKEND_BASE_URL=$BACKEND_BASE_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$BACKEND_BASE_URL" || true
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f

      - name: Find and upload APK
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file found anywhere!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: belge-asistani-android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

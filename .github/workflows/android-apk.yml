name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.belgeasistani

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Force compileSdk 36 for the app AND Android plugin subprojects.
      # This resolves AAR metadata failures from dependencies requiring API 36.
      - name: Configure Android subprojects to compile with SDK 36
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-android-sdk.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.plugins.withId('com.android.application') {
                  project.afterEvaluate {
                      def androidExtension = project.extensions.findByName('android')
                      if (androidExtension != null) {
                          androidExtension.compileSdkVersion(36)
                      }
                  }
              }
              project.plugins.withId('com.android.library') {
                  project.afterEvaluate {
                      def androidExtension = project.extensions.findByName('android')
                      if (androidExtension != null) {
                          androidExtension.compileSdkVersion(36)
                      }
                  }
              }
          }
          GRADLE

      - name: Install Flutter packages
        run: flutter pub get

      - name: Check backend URL
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://example.com' }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "ERROR: BACKEND_BASE_URL is empty."
            exit 1
          fi
          case "$BACKEND_BASE_URL" in
            http://*|https://*) ;;
            *) echo "ERROR: BACKEND_BASE_URL must start with http:// or https://"; exit 1 ;;
          esac
          if [ "$BACKEND_BASE_URL" = "https://example.com" ]; then
            echo "WARNING: BACKEND_BASE_URL is not configured; using https://example.com as a build-only fallback. Configure the real API URL for app backend features."
          else
            echo "Using configured backend URL."
          fi

      - name: Build release APK
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://example.com' }}
        run: |
          flutter build apk --release --no-pub \
            --dart-define=API_BASE_URL="$BACKEND_BASE_URL"

      - name: Verify APK
        id: find_apk
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK was not created at $APK_PATH"
            find build android -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: belge-asistani-android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

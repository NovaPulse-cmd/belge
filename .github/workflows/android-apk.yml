name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.belgeasistani

      - name: Install packages
        run: flutter pub get

      - name: Fix file_picker compileSdk
        run: |
          FILE_PICKER_GRADLE=$(find ~/.pub-cache -path "*file_picker*/android/build.gradle" 2>/dev/null | head -n 1)
          if [ -n "$FILE_PICKER_GRADLE" ]; then
            echo "Düzeltiliyor: $FILE_PICKER_GRADLE"
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' "$FILE_PICKER_GRADLE"
            sed -i 's/compileSdk .*/compileSdk 36/' "$FILE_PICKER_GRADLE"
          else
            echo "file_picker build.gradle bulunamadı, atlanıyor."
          fi

      - name: Build release APK
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          BACKEND_BASE_URL="${BACKEND_BASE_URL:-https://example.com}"
          echo "Using BACKEND_BASE_URL=$BACKEND_BASE_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$BACKEND_BASE_URL"

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK bulunamadı!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: belge-asistani-android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
